# Konfigurasi Nginx Produksi untuk Portofolio & Subpath Static Serving
# Lokasi deployment: /etc/nginx/sites-available/portofolio.conf

server {
    listen 80;
    server_name portofolio.bagaspratama.dev www.portofolio.bagaspratama.dev;

    # Pengaturan Upload File ZIP Maksimal (50MB)
    client_max_body_size 50M;

    # Gzip Compression untuk Performa Tinggi
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 1. Subpath Serving untuk Hasil Ekstraksi Proyek Web Statis (.ZIP)
    location /projects/ {
        alias /var/www/portofolio/public/projects/;
        index index.html;
        try_files $uri $uri/ =404;

        # Caching Aset Statis
        expires 7d;
        add_header Cache-Control "public, no-transform";

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
    }

    # 2. Reverse Proxy ke Aplikasi Next.js Standalone
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
